server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 執行階段設定，絕對不能快取，否則改了後端網址也不會生效
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # 打包後的檔名帶雜湊值，可以長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 網站圖示與分享大圖：由啟動腳本產生，代理到後端。
    #
    # 為什麼要繞這一圈：圖片是後台上傳的，檔名帶雜湊值而且會變；
    # 但 Google 抓 favicon **只看首頁的靜態 HTML、不執行 JavaScript**，
    # 所以前端載入後才換 <link rel="icon"> 是沒有用的。
    # 這裡讓 /favicon.ico 與 /site-icon.png 變成**同網域的固定網址**
    # （Google 的圖示要跟首頁同網域才算數），內容則由後端決定。
    #
    # 用萬用字元 include：檔案不存在時 nginx 不會啟動失敗
    # （API_BASE 沒設定的話啟動腳本就不會產生它）。
    include /etc/nginx/site-icon/*.conf;

    # API 與圖片應該打到「後端服務」，不該由這台靜態伺服器處理。
    # 如果請求跑到這裡，代表前端的 VITE_API_BASE 沒設定或設錯了。
    # 這裡刻意回傳明確的錯誤，而不是讓下面的 SPA fallback 回一頁 HTML ——
    # 那會讓前端把 HTML 當成 JSON 解析，錯誤訊息變得完全看不出原因。
    location ~ ^/(api|uploads)/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 503 '{"detail":"這個請求被前端的靜態伺服器接到了，代表 VITE_API_BASE 沒有設定。請到 Zeabur 的前端服務設定 VITE_API_BASE 為後端網址，然後【重新部署】前端（只重啟沒有用，Vite 是在建置時寫入的）。"}';
    }

    # React Router 是前端路由，重新整理 /products/3 這種網址時
    # 伺服器上並沒有對應的檔案，一律回 index.html 交給前端處理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
