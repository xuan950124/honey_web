<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      這裡的標題與描述，載入後會依後台「網站設定」動態覆寫。

      但**這一份靜態版本才是分享預覽真正會用到的內容** ——
      LINE 與 Facebook 的預覽卡片不會執行 JavaScript，
      它們只讀得到這個檔案裡原本就有的標籤。
      所以這裡要寫一份完整、合理、不依賴 JS 的預設值。
    -->
    <title>黃家基蜜｜基隆七堵自家蜂場．純蜂蜜產地直送</title>
    <meta name="description" content="基隆七堵山區自家蜂場，等蜜在巢裡熟成才採收，裝瓶前不加水不加糖。農業部溯源追溯編號可查，生產者查得到。" />
    <meta name="keywords" content="基隆蜂蜜,七堵蜂蜜,台灣蜂蜜,野花蜜,龍眼蜜,純蜂蜜,蜂蜜團購,蜂蜜禮盒" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://huanglong-honey.com/" />

    <meta property="og:site_name" content="黃家基蜜" />
    <meta property="og:title" content="黃家基蜜｜基隆七堵自家蜂場．純蜂蜜產地直送" />
    <meta property="og:description" content="基隆七堵山區自家蜂場，等蜜在巢裡熟成才採收，裝瓶前不加水不加糖。農業部溯源追溯編號可查。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://huanglong-honey.com/" />
    <meta property="og:locale" content="zh_TW" />
    <!--
      分享大圖。這個網址由 nginx 代理到後端，內容是後台上傳的首頁主視覺，
      所以換圖不必重新部署，而網址本身永遠不變（LINE 與 FB 會快取網址）。
    -->
    <meta property="og:image" content="https://huanglong-honey.com/og-cover.jpg" />
    <meta property="og:image:alt" content="黃家基蜜．基隆七堵自家蜂場" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="黃家基蜜｜基隆七堵自家蜂場．純蜂蜜產地直送" />
    <meta name="twitter:description" content="基隆七堵山區自家蜂場，等蜜在巢裡熟成才採收。" />

    <!--
      Google 搜尋結果旁邊那個小圓圖。

      **Google 抓 favicon 只讀首頁的靜態 HTML，不會執行 JavaScript**，
      所以前端載入後才把它換成後台設定的圖是沒有用的 —— Google 早就抓完走了。
      而且圖示要跟首頁**同一個網域**才算數，直接寫 api.xxx.com 也不行。

      解法是這兩個同網域的固定網址，由 nginx 代理到後端，
      內容是後台上傳的那張圖。換圖不用重新部署，網址也永遠不變。
      /favicon.svg 只是後端連不上時的備援。
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/site-icon.png" />
    <link rel="apple-touch-icon" href="/site-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 執行階段設定，必須在應用程式之前載入 -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
